<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Mecânica - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <form>
            <h1>Oficina Mecânica</h1>
            <h2>Login</h2>
            <div class="inputgroup">
                <label for="username"></label>
                <div class="input-item">
                    <input id="username" type="text" placeholder="👤 Nome de usuário">
                </div>
            </div>
            <div class="inputgroup">
                <label for="password"></label>
                <div class="input-item">
                    <input id="senha" type="password" placeholder="🔒︎ Senha:">
                </div>
            </div>
            <div class="buttons">
            <button class="btn-login"> <a href="principal.html">Logar</a></button>
            <button class="btn-login">Criar conta</button>
            </div>
        </form>
    </main>
</body>

</html>
